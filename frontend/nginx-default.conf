server {
    listen ${PORT};
    server_name _;
    resolver 1.1.1.1 8.8.8.8 ipv6=off valid=30s;

    set $backend_base_url ${BACKEND_BASE_URL};

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Proxy API requests to Django backend
    location /app/ {
        proxy_pass $backend_base_url;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-CSRFToken $http_x_csrftoken;
        proxy_ssl_server_name on;
        proxy_cookie_path / /;
        proxy_redirect off;
    }

    location /admin/ {
        proxy_pass $backend_base_url;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_cookie_path / /;
        proxy_redirect off;
    }

    # Django admin assets are served from /static/admin/ and must go to backend.
    location /static/ {
        proxy_pass $backend_base_url;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_redirect off;
    }

    # Serve all static files directly
    location / {
        try_files $uri $uri/ /index.html;
    }
}

